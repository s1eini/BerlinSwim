name: Scrape pools

on:
  schedule:
    # every 20 minutes (at :07, :27, :47 – off-peak minutes start more reliably on GitHub)
    # from 04:07 to 22:47 UTC (≈ 05:00–23:50 Berlin)
    - cron: "7-59/20 4-22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/scrape.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s scraper/tests
      - name: Scrape
        run: python scraper/scrape.py --out site/pools.json
      - name: Index page
        run: |
          echo '<!doctype html><meta charset="utf-8"><title>BerlinSwim data</title><a href="pools.json">pools.json</a>' > site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
