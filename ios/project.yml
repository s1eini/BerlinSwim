name: BerlinSwim
options:
  bundleIdPrefix: de.eatbl
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # App + widget version. Raise CURRENT_PROJECT_VERSION for every TestFlight upload.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "5"
    # Set your team here (or in Xcode → Signing) for device builds:
    DEVELOPMENT_TEAM: 55SQ97YG8M
    CODE_SIGN_STYLE: Automatic
    # Localization: German source, English via String Catalogs (*.xcstrings)
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  BadKit:
    path: BadKit

targets:
  BerlinSwim:
    type: application
    platform: iOS
    sources:
      - path: BerlinSwim
    dependencies:
      - package: BadKit
      - target: BerlinSwimWidget
        embed: true
    entitlements:
      path: BerlinSwim/BerlinSwim.entitlements
      properties:
        com.apple.security.application-groups: [group.de.eatbl.berlinswim]
    info:
      path: BerlinSwim/Info.plist
      properties:
        CFBundleDisplayName: Berlin Swim
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Only standard HTTPS – skips the export compliance question for every build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad: all orientations (required for Split View / Slide Over)
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Damit du siehst, welche Bäder du von hier aus noch rechtzeitig erreichst."
        PoolsFeedURL: "$(POOLS_FEED_URL)"
        SupportURL: "$(SUPPORT_URL)"
        CFBundleURLTypes:
          - CFBundleURLName: de.eatbl.BerlinSwim
            CFBundleURLSchemes: [berlinswim]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.eatbl.BerlinSwim
        POOLS_FEED_URL: "https://berlinswim.eatbl.de/pools.json"
        # Ko-fi tip link in Settings. Set to "" to hide it (e.g. if App Review objects to external tips).
        SUPPORT_URL: "https://ko-fi.com/eatbl"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  BerlinSwimWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BerlinSwimWidget
      - path: BerlinSwim/Resources/pools-seed.json
        buildPhase: resources
    dependencies:
      - package: BadKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: BerlinSwimWidget/BerlinSwimWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.de.eatbl.berlinswim]
    info:
      path: BerlinSwimWidget/Info.plist
      properties:
        CFBundleDisplayName: Berlin Swim
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: "Damit das Widget erreichbare Bäder in deiner Nähe zeigt."
        PoolsFeedURL: "$(POOLS_FEED_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.eatbl.BerlinSwim.Widget
        POOLS_FEED_URL: "https://berlinswim.eatbl.de/pools.json"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad

  BerlinSwimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BerlinSwimUITests
    dependencies:
      - target: BerlinSwim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.eatbl.BerlinSwim.UITests
        TEST_TARGET_NAME: BerlinSwim
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BerlinSwim:
    build:
      targets:
        BerlinSwim: all
        BerlinSwimWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BerlinSwimUITests
